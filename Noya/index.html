<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ממלכת הסקוושים של נויה</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ══ SCREEN: Store ══════════════════════════════════ -->
  <div id="screen-store" class="screen active">
    <header class="header">
      <span class="brand">🛍️ ממלכת הסקוושים של נויה</span>
      <div style="display:flex;gap:10px;align-items:center">
        <a href="admin.html" class="admin-link">🔐 מנהל</a>
        <button class="cart-btn" id="btn-open-cart">
          🛒 עגלה
          <span class="cart-badge" id="cart-count">0</span>
        </button>
      </div>
    </header>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="🔍 חפש מוצר..." autocomplete="off">
    </div>

    <div id="products-container">
      <div style="text-align:center;padding:60px">
        <span class="loading-spinner">⏳</span>
      </div>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

  <!-- ══ SCREEN: Cart ═══════════════════════════════════ -->
  <div id="screen-cart" class="screen">
    <div class="screen-header">
      <button class="btn-back" id="btn-back-store">←</button>
      <h2>🛒 העגלה שלי</h2>
    </div>
    <div class="cart-list" id="cart-list"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>סה"כ:</span>
        <span class="amount" id="cart-total">₪0</span>
      </div>
      <button class="btn-primary" id="btn-to-order">המשך להזמנה ←</button>
    </div>
  </div>

  <!-- ══ SCREEN: Order Form ═════════════════════════════ -->
  <div id="screen-order" class="screen">
    <div class="screen-header">
      <button class="btn-back" id="btn-back-cart">←</button>
      <h2>📋 פרטי ההזמנה</h2>
    </div>
    <form class="order-form" id="order-form">

      <div class="form-group">
        <label for="customer-name">שם פרטי *</label>
        <input type="text" id="customer-name" placeholder="הכנס את שמך" required>
      </div>
      <div class="form-group">
        <label for="customer-phone">טלפון *</label>
        <input type="tel" id="customer-phone" placeholder="050-0000000" required>
      </div>

      <!-- Payment method -->
      <div class="form-group">
        <label>אמצעי תשלום *</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="payment" value="cash" required> 💵 מזומן
          </label>
          <label class="radio-option">
            <input type="radio" name="payment" value="bit"> 📱 ביט
          </label>
        </div>
      </div>

      <!-- Delivery method -->
      <div class="form-group">
        <label>אופן קבלה *</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="delivery" value="self" required> 🏠 איסוף עצמי
          </label>
          <label class="radio-option">
            <input type="radio" name="delivery" value="delivery"> 🚗 משלוח
          </label>
        </div>
      </div>

      <!-- Delivery details (shown only when delivery selected) -->
      <div id="delivery-details" style="display:none">
        <div class="form-group">
          <label for="delivery-address">כתובת למשלוח *</label>
          <input type="text" id="delivery-address" placeholder="רחוב, מספר, עיר">
        </div>
        <div class="form-group">
          <label>אזור משלוח *</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="area" value="haifa"> 🏙️ חיפה (₪15)
            </label>
            <label class="radio-option">
              <input type="radio" name="area" value="outside"> 🗺️ מחוץ לחיפה (₪20)
            </label>
          </div>
        </div>
        <div class="delivery-fee-note" id="delivery-fee-note"></div>
      </div>

      <div class="form-group">
        <label for="customer-notes">הערות</label>
        <textarea id="customer-notes" placeholder="כתוב כאן הערות אם יש..."></textarea>
      </div>

      <!-- Order summary -->
      <div class="order-summary">
        <div class="summary-row">
          <span>סכום פריטים:</span>
          <span id="summary-items">₪0</span>
        </div>
        <div class="summary-row" id="summary-delivery-row" style="display:none">
          <span>דמי משלוח:</span>
          <span id="summary-delivery">₪0</span>
        </div>
        <div class="summary-row summary-total">
          <span>סה"כ לתשלום:</span>
          <span id="summary-grand-total">₪0</span>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="btn-submit-order">שלח הזמנה 🎉</button>
    </form>
  </div>

  <!-- ══ SCREEN: Confirmation ═══════════════════════════ -->
  <div id="screen-confirm" class="screen">
    <div class="confirmation">
      <div class="big-emoji">🎉</div>
      <h2>ההזמנה נשלחה!</h2>
      <p>תודה! נחזור אליך בקרוב כדי לתאם.</p>
      <a id="btn-whatsapp" class="btn-primary" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px" target="_blank">
        💬 פתח WhatsApp
      </a>
      <button class="btn-secondary" id="btn-back-home">חזרה לחנות</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
